<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Panteão">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cf0"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marmore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e7ff"/>
    </linearGradient>
  </defs>

  <!-- Base: quadrado arredondado com gradiente -->
  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <!-- Reflexo de vidro no topo -->
  <path d="M0 116C0 52 52 0 116 0h280c64 0 116 52 116 116v96C400 250 130 250 0 212z" fill="url(#brilho)"/>

  <!-- Templo: frontão com um ponto de mapa, arquitrave, 4 colunas e degraus -->
  <g fill="url(#marmore)">
    <path d="M256 104 412 192H100z"/>
    <rect x="112" y="204" width="288" height="20" rx="7"/>
    <rect x="128" y="240" width="40" height="116" rx="10"/>
    <rect x="200" y="240" width="40" height="116" rx="10"/>
    <rect x="272" y="240" width="40" height="116" rx="10"/>
    <rect x="344" y="240" width="40" height="116" rx="10"/>
    <rect x="108" y="370" width="296" height="18" rx="7"/>
    <rect x="88" y="396" width="336" height="18" rx="7" opacity=".82"/>
  </g>
  <!-- Ponto de localização vazado no frontão (o mapa é a alma do app) -->
  <circle cx="256" cy="162" r="15" fill="#8b5cf6"/>
  <circle cx="256" cy="162" r="6" fill="#fff"/>
</svg>
