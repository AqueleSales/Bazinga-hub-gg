<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <title>Entrar · Bazinga</title>

  <meta name="description" content="Chat, mapa e eventos. Entre com o Google e comece.">
  <link rel="manifest" href="{{ url_for('main.manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='css/img/bazinga_logo.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #5865F2;
      --brand-2: #23a559;
      --bg: #0b0c10;
      --texto: #f2f3f5;
      --texto-fraco: #9aa0a6;
      --borda: rgba(255,255,255,.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--texto);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* ---- Fundo animado: duas auroras que respiram devagar ---- */
    .aurora {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .5;
      pointer-events: none;
      will-change: transform;
    }
    .aurora.a1 {
      width: 52vmax; height: 52vmax;
      background: radial-gradient(circle, var(--brand) 0%, transparent 68%);
      top: -18vmax; left: -14vmax;
      animation: flutuar1 19s ease-in-out infinite;
    }
    .aurora.a2 {
      width: 46vmax; height: 46vmax;
      background: radial-gradient(circle, var(--brand-2) 0%, transparent 68%);
      bottom: -16vmax; right: -12vmax;
      animation: flutuar2 23s ease-in-out infinite;
    }
    @keyframes flutuar1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(8vmax, 6vmax) scale(1.12); }
    }
    @keyframes flutuar2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-7vmax, -5vmax) scale(1.15); }
    }

    /* Grade sutil por cima, dá profundidade sem pesar */
    .grade {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 78%);
    }

    /* ---- Cartão ---- */
    .cartao {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(20, 21, 26, .72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--borda);
      border-radius: 22px;
      padding: 44px 36px 32px;
      text-align: center;
      box-shadow: 0 28px 70px rgba(0,0,0,.6);
      animation: subir .7s cubic-bezier(.16,.84,.44,1) both;
    }
    @keyframes subir {
      from { opacity: 0; transform: translateY(22px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    .logo {
      width: 78px; height: 78px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(140deg, var(--brand), var(--brand-2));
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 14px 34px rgba(88,101,242,.34);
      animation: pulsar 4.5s ease-in-out infinite;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes pulsar {
      0%, 100% { transform: translateY(0); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 14px 34px rgba(88,101,242,.34); }
      50%      { transform: translateY(-6px); box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 22px 46px rgba(88,101,242,.5); }
    }

    h1 {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 29px; font-weight: 700; letter-spacing: -.02em;
      margin-bottom: 8px;
    }
    .sub { color: var(--texto-fraco); font-size: 15px; line-height: 1.5; margin-bottom: 30px; }

    /* ---- Botão Google ---- */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 14px 18px;
      background: #fff; color: #1f1f1f;
      border: none; border-radius: 12px;
      font: 600 15px/1 Inter, sans-serif;
      cursor: pointer; text-decoration: none;
      transition: transform .16s cubic-bezier(.16,.84,.44,1), box-shadow .16s;
      box-shadow: 0 6px 18px rgba(0,0,0,.3);
    }
    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.42); }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { width: 19px; height: 19px; flex-shrink: 0; }

    .aviso {
      margin-top: 18px;
      font-size: 12px; line-height: 1.5;
      color: var(--texto-fraco);
    }
    .aviso a { color: var(--texto-fraco); }

    /* ---- Tirinha de recursos ---- */
    .recursos {
      display: flex; gap: 8px; margin-top: 28px;
      padding-top: 22px; border-top: 1px solid var(--borda);
    }
    .recurso { flex: 1; }
    .recurso .ico { font-size: 19px; margin-bottom: 5px; display: block; }
    .recurso span.txt { font-size: 11px; color: var(--texto-fraco); font-weight: 500; }

    .rodape {
      position: fixed; bottom: 18px; left: 0; right: 0;
      text-align: center; font-size: 12px; color: rgba(255,255,255,.26);
    }

    @media (max-width: 420px) {
      .cartao { padding: 34px 24px 26px; border-radius: 18px; }
      h1 { font-size: 25px; }
    }

    /* Respeita quem pediu menos movimento no sistema */
    @media (prefers-reduced-motion: reduce) {
      .aurora, .logo, .cartao { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="grade"></div>

  <main class="cartao">
    <div class="logo">
      <img src="{{ url_for('static', filename='css/img/bazinga_logo.png') }}" alt="Bazinga">
    </div>

    <h1>Entra na Bazinga</h1>
    <p class="sub">Chat, mapa com servidores plantados e calendário de eventos. Sem cadastro — usa a sua conta do Google.</p>

    <a class="btn-google" href="{{ url_for('auth.login') }}">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com Google
    </a>

    <p class="aviso">Ao entrar você concorda em se comportar. A gente guarda só nome, e-mail e foto do seu perfil Google.</p>

    <div class="recursos">
      <div class="recurso"><span class="ico">💬</span><span class="txt">Chat e voz</span></div>
      <div class="recurso"><span class="ico">🗺️</span><span class="txt">Mapa ao vivo</span></div>
      <div class="recurso"><span class="ico">📅</span><span class="txt">Eventos</span></div>
    </div>
  </main>

  <p class="rodape">Bazinga Hub</p>

  <script>
    // Registra o service worker aqui já: assim, quando a pessoa chegar na
    // tela seguinte, o navegador já sabe que o site é instalável.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
