<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bazinga Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="aura"></div>

  <nav class="navbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span class="dot"></span> Bazinga Hub
    </a>
    <div class="nav-links">
      <a href="{{ url_for('main.index') }}">Início</a>
      <a href="#" class="soon">Bazinga Awards</a>
      <a href="{{ url_for('main.chat') }}">Chat</a>
      <a href="#" class="soon" title="Em breve">Ultimate Bazinga</a>
    </div>
    <div class="nav-auth">
        <!-- Atalho direto para o chat enquanto o auth não é linkado -->
        <a class="btn-ghost" href="{{ url_for('main.chat') }}">Acessar o BazingaCord</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
