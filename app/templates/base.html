<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bazinga Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="aura"></div>

  <nav class="navbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span class="dot"></span> Bazinga Hub
    </a>
    <div class="nav-links">
      <a href="{{ url_for('main.index') }}">Início</a>
      <a href="#" class="soon">Bazinga Awards</a>
      <a href="{{ url_for('main.chat') }}">Chat</a>
      <a href="#" class="soon" title="Em breve">Ultimate Bazinga</a>
    </div>

    <!-- ÁREA DE AUTENTICAÇÃO DINÂMICA -->
    <div class="nav-auth" style="display: flex; align-items: center; gap: 16px;">
      {% if user %}
        <!-- Quando o usuário ESTÁ logado -->
        <div style="display: flex; align-items: center; gap: 8px;">
            {% if user.avatar %}
                <img src="{{ user.avatar }}" alt="{{ user.name }}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #23a559;">
            {% else %}
                <div style="width: 32px; height: 32px; border-radius: 50%; background-color: #23a559; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px;">
                    {{ user.name[0]|upper }}
                </div>
            {% endif %}
            <span style="color: #dbdee1; font-weight: 500; font-family: 'Inter', sans-serif;">{{ user.name }}</span>
        </div>
        <a class="btn-ghost" href="{{ url_for('auth.logout') }}" style="border-color: #f23f42; color: #f23f42;">Sair</a>
      {% else %}
        <!-- Quando o usuário NÃO ESTÁ logado -->
        <a class="btn-ghost" href="{{ url_for('auth.login', provider='google') }}"><i class="fa-brands fa-google" style="margin-right: 8px;"></i>Entrar com Google</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
