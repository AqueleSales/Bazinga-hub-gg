<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pantheon">
  <!-- Base: quadrado arredondado preto, chapado -->
  <rect width="512" height="512" rx="116" fill="#14161b"/>
  <!-- Templo dourado: frontão com um ponto de mapa, arquitrave, 4 colunas e degraus -->
  <g fill="#d4a24c">
    <path d="M256 104 412 192H100z"/>
    <rect x="112" y="204" width="288" height="20" rx="7"/>
    <rect x="128" y="240" width="40" height="116" rx="10"/>
    <rect x="200" y="240" width="40" height="116" rx="10"/>
    <rect x="272" y="240" width="40" height="116" rx="10"/>
    <rect x="344" y="240" width="40" height="116" rx="10"/>
    <rect x="108" y="370" width="296" height="18" rx="7"/>
    <rect x="88" y="396" width="336" height="18" rx="7" opacity=".8"/>
  </g>
  <!-- Ponto de localização vazado no frontão (o mapa é a alma do app) -->
  <circle cx="256" cy="162" r="15" fill="#14161b"/>
  <circle cx="256" cy="162" r="6" fill="#d4a24c"/>
</svg>
